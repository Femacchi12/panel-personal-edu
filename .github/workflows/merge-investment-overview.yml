name: Merge investment overview

on:
  push:
    paths:
      - '.github/workflows/merge-investment-overview.yml'

permissions:
  contents: write

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Merge summary into official investment renderer
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          inv = Path('investment-period-enhancement.js')
          text = inv.read_text(encoding='utf-8')

          marker = "      const categoryFilters=selectedLocal('invClass').length||selectedLocal('invCategory').length||selectedLocal('invSubcategory').length;\n      const effectiveMode=selectedLocal('investmentValueMode')[0]||'total';"
          replacement = """      const categoryFilters=selectedLocal('invClass').length||selectedLocal('invCategory').length||selectedLocal('invSubcategory').length;
      const consolidated=summary.reduce((acc,r)=>{const market=parseNumber(r['Valor mercado']),capital=parseNumber(r['Aportes/Incrementos']),result=String(r.Resultado||'').trim()?parseNumber(r.Resultado):market-capital,base=String(r['Moneda base']||'COP').toUpperCase();acc.capital+=convertBase(capital,base,currency,rates);acc.result+=convertBase(result,base,currency,rates);acc.total+=convertBase(market,base,currency,rates);return acc;},{capital:0,result:0,total:0});
      const resultClass=consolidated.result>0?'result-positive':consolidated.result<0?'result-negative':'';
      const summaryHtml=`<div class=\"investment-consolidated-overview\"><div class=\"investment-summary-title\"><strong>Resumen consolidado de inversiones</strong><span>${summary.length} plataforma${summary.length===1?'':'s'} · último corte disponible</span></div><div class=\"investment-summary-grid\"><div class=\"investment-summary-card\"><span>Capital aportado</span><strong>${esc(money(consolidated.capital,currency))}</strong><small>Aportes / incrementos acumulados</small></div><div class=\"investment-summary-card ${resultClass}\"><span>Ganancia / pérdida</span><strong>${esc(money(consolidated.result,currency))}</strong><small>Resultado acumulado frente al capital</small></div><div class=\"investment-summary-card\"><span>Capital + ganancia/pérdida</span><strong>${esc(money(consolidated.total,currency))}</strong><small>Valor actual consolidado de las inversiones</small></div></div></div>`;
      const effectiveMode=selectedLocal('investmentValueMode')[0]||'total';"""
          if marker not in text:
              raise SystemExit('summary insertion marker not found')
          text = text.replace(marker, replacement, 1)

          host_marker = '      host.innerHTML=`<div class="kpi-grid investment-kpis">'
          if host_marker not in text:
              raise SystemExit('host marker not found')
          text = text.replace(host_marker, '      host.innerHTML=`${summaryHtml}<div class="kpi-grid investment-kpis">', 1)
          inv.write_text(text, encoding='utf-8')

          idx = Path('index.html')
          html = idx.read_text(encoding='utf-8')
          html = html.replace('  <script src="investment-summary-overview.js?v=20260827-0942"></script>\n', '')
          html = html.replace('investment-period-enhancement.js?v=20260827-1505', 'investment-period-enhancement.js?v=20260827-1540')
          idx.write_text(html, encoding='utf-8')

          css = Path('styles.css')
          styles = css.read_text(encoding='utf-8')
          block = """

/* Consolidated investment overview - owned by investment-period-enhancement.js */
.investment-consolidated-overview{display:grid;gap:9px;margin-bottom:2px}
.investment-consolidated-overview .investment-summary-title{display:flex;justify-content:space-between;gap:12px;align-items:end;color:#7f90a8;font-size:9px}
.investment-consolidated-overview .investment-summary-title strong{color:#eef4fb;font-size:12px}
.investment-consolidated-overview .investment-summary-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.investment-consolidated-overview .investment-summary-card{background:linear-gradient(180deg,#0d1520,#0a1018);border:1px solid var(--border-soft);border-radius:13px;padding:13px 14px;min-width:0}
.investment-consolidated-overview .investment-summary-card span{display:block;color:#718198;font-size:8px;text-transform:uppercase;letter-spacing:.06em;font-weight:800}
.investment-consolidated-overview .investment-summary-card strong{display:block;margin-top:7px;font-size:21px;line-height:1.15;color:#edf3fb}
.investment-consolidated-overview .investment-summary-card small{display:block;margin-top:5px;color:#6f8095;font-size:9px;line-height:1.4}
.investment-consolidated-overview .investment-summary-card.result-positive strong{color:#26d07c}
.investment-consolidated-overview .investment-summary-card.result-negative strong{color:#ff667a}
@media(max-width:760px){.investment-consolidated-overview .investment-summary-grid{grid-template-columns:1fr}}
"""
          if 'Consolidated investment overview - owned by investment-period-enhancement.js' not in styles:
              css.write_text(styles + block, encoding='utf-8')

          legacy = Path('investment-summary-overview.js')
          if legacy.exists():
              legacy.unlink()

          if 'investment-summary-overview.js' in idx.read_text(encoding='utf-8'):
              raise SystemExit('legacy overview still loaded')
          if 'summaryHtml' not in inv.read_text(encoding='utf-8'):
              raise SystemExit('summary not merged')
          PY

          node --check investment-period-enhancement.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A investment-period-enhancement.js investment-summary-overview.js index.html styles.css
          git commit -m "Merge investment overview into official renderer"
          git push

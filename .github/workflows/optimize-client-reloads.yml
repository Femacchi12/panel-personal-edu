name: optimize client reloads

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  optimize:
    if: github.event.head_commit.message != 'Optimize cached client reloads'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply targeted optimization
        shell: bash
        run: |
          echo '' | base64 -d > /tmp/optimize.py
          python /tmp/optimize.py
      - name: Validate JavaScript
        run: |
          node --check app.js
          node --check card-specific-filter.js
          node --check section-data-filters.js
          git diff --check
      - name: Commit optimization
        shell: bash
        run: |
          git config user.name 'Eduardo Macchi'
          git config user.email 'fernandoemacchi@gmail.com'
          git add app.js card-specific-filter.js section-data-filters.js
          if git diff --cached --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git commit -m 'Optimize cached client reloads'
          git push origin main

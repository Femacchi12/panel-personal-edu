name: Simplify investment value filter

on:
  push:
    paths:
      - '.github/workflows/simplify-investment-value-filter.yml'

permissions:
  contents: write

jobs:
  simplify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Keep only the three real investment metrics
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          p = Path('section-data-filters.js')
          text = p.read_text(encoding='utf-8')
          old = "  const INVESTMENT_VALUE_OPTIONS = [\n    {value:'all', label:'Todos'},\n    {value:'capital', label:'Solo capital'},\n    {value:'result', label:'Ganancia / pérdida'},\n    {value:'total', label:'Capital + ganancia/pérdida'}\n  ];"
          new = "  const INVESTMENT_VALUE_OPTIONS = [\n    {value:'capital', label:'Solo capital'},\n    {value:'result', label:'Ganancia / pérdida'},\n    {value:'total', label:'Capital + ganancia/pérdida'}\n  ];"
          if old not in text:
              raise SystemExit('Investment value options pattern not found')
          text = text.replace(old, new).replace("defaultValues: ['all']", "defaultValues: ['total']")
          p.write_text(text, encoding='utf-8')

          p = Path('investment-period-enhancement.js')
          text = p.read_text(encoding='utf-8')
          old = "      const valueMode=selectedLocal('investmentValueMode')[0]||'all';\n      const effectiveMode=valueMode==='all'?'total':valueMode;"
          new = "      const effectiveMode=selectedLocal('investmentValueMode')[0]||'total';"
          if old not in text:
              raise SystemExit('Investment effective mode pattern not found')
          p.write_text(text.replace(old, new), encoding='utf-8')

          p = Path('index.html')
          text = p.read_text(encoding='utf-8')
          text = text.replace('section-data-filters.js?v=20260827-1414', 'section-data-filters.js?v=20260827-1505')
          text = text.replace('investment-period-enhancement.js?v=20260827-1414', 'investment-period-enhancement.js?v=20260827-1505')
          p.write_text(text, encoding='utf-8')

          if "{value:'all', label:'Todos'}" in Path('section-data-filters.js').read_text(encoding='utf-8'):
              raise SystemExit('Legacy Todos metric remains')
          if "defaultValues: ['total']" not in Path('section-data-filters.js').read_text(encoding='utf-8'):
              raise SystemExit('Total is not the default metric')
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add section-data-filters.js investment-period-enhancement.js index.html
          git commit -m "Simplify investment value filter to three metrics"
          git push

name: Apply canonical debt normalization

on:
  push:
    paths:
      - '.github/workflows/apply-canonical-debt.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply patch
        run: python3 scripts/canonical_debt_patch.py
      - name: Validate JavaScript
        run: |
          node --check app.js
          node --check card-payments-installments.js
          node --check backend/server.js
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js card-payments-installments.js
          if git diff --cached --quiet; then
            echo "No changes required"
          else
            git commit -m "Canonicalize Nu installment debt calculations"
            git push
          fi

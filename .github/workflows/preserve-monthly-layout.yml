name: Preserve monthly panel layout

on:
  push:
    paths:
      - '.github/workflows/preserve-monthly-layout.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply patch
        run: |
          python3 scripts/preserve_monthly_layout.py
          node --check monthly-projection-control.js
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add monthly-projection-control.js
          if git diff --cached --quiet; then
            echo "No changes required"
          else
            git commit -m "Preserve monthly panel order without DOM churn"
            git push
          fi

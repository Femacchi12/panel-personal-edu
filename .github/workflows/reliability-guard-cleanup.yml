name: Reliability guard cleanup

on:
  push:
    paths:
      - '.github/workflows/reliability-guard-cleanup.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Consolidate reliability guard into owning module
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('dashboard-reliability-fixes.js')
          text = path.read_text(encoding='utf-8')

          old_move = """  function moveMonthlyPanels() {
    const view=activeView();
    if (!['gastos','flujo'].includes(view)) return;
    const root=document.getElementById('viewRoot');
    const suite=document.getElementById('monthlyProjectionSuite');
    if (!root || !suite) return;
    const programmed=suite.querySelector('.monthly-programmed-panel');
    const comparison=suite.querySelector('.monthly-comparison-panel');
    if (!programmed && !comparison) return;

    [...root.children].forEach(el=>{
      if ((el.classList?.contains('monthly-programmed-panel') || el.classList?.contains('monthly-comparison-panel')) && el!==programmed && el!==comparison) el.remove();
    });
    if (programmed) root.appendChild(programmed);
    if (comparison) root.appendChild(comparison);
  }
"""
          new_move = """  function moveMonthlyPanels() {
    const view=activeView();
    if (!['gastos','flujo'].includes(view)) return;
    const root=document.getElementById('viewRoot');
    const suite=document.getElementById('monthlyProjectionSuite');
    if (!root || !suite) return;
    const programmed=suite.querySelector('.monthly-programmed-panel');
    const comparison=suite.querySelector('.monthly-comparison-panel');
    if (!programmed && !comparison) return;

    [...root.children].forEach(el=>{
      if ((el.classList?.contains('monthly-programmed-panel') || el.classList?.contains('monthly-comparison-panel')) && el!==programmed && el!==comparison) el.remove();
    });

    const target=[programmed,comparison].filter(Boolean);
    const children=[...root.children];
    const alreadyAtEnd=target.every((el,index)=>children[children.length-target.length+index]===el);
    if (alreadyAtEnd) return;
    target.forEach(el=>root.appendChild(el));
  }
"""
          if old_move not in text:
              raise SystemExit('moveMonthlyPanels marker not found')
          text = text.replace(old_move, new_move, 1)

          old_total = """  function addFlowDetailTotal() {
    const table=document.querySelector('#flowMatrixDetail table');
    if (!table) return;
    table.querySelector('tfoot[data-auto-total]')?.remove();
    const headers=[...table.querySelectorAll('thead th')].map(th=>norm(th.textContent));
    const indexes={cop:headers.indexOf('monto cop'),ars:headers.indexOf('monto ars'),usd:headers.indexOf('monto usd')};
    if (indexes.cop<0) return;
    const rows=[...table.querySelectorAll('tbody tr')];
    const sums={cop:0,ars:0,usd:0};
    rows.forEach(row=>{
      if(indexes.cop>=0)sums.cop+=parseNumber(row.cells[indexes.cop]?.textContent);
      if(indexes.ars>=0)sums.ars+=parseNumber(row.cells[indexes.ars]?.textContent);
      if(indexes.usd>=0)sums.usd+=parseNumber(row.cells[indexes.usd]?.textContent);
    });
    const foot=document.createElement('tfoot');
    foot.dataset.autoTotal='1';
    const tr=document.createElement('tr');
    tr.className='flow-detail-total-row';
    headers.forEach((_,index)=>{
      const td=document.createElement('td');
      if(index===0)td.textContent='TOTAL';
      if(index===indexes.cop)td.textContent=formatMoney(sums.cop,'COP');
      if(index===indexes.ars)td.textContent=formatMoney(sums.ars,'ARS');
      if(index===indexes.usd)td.textContent=formatMoney(sums.usd,'USD');
      tr.appendChild(td);
    });
    foot.appendChild(tr);
    table.appendChild(foot);
  }
"""
          new_total = """  function addFlowDetailTotal() {
    const table=document.querySelector('#flowMatrixDetail table');
    if (!table) return;
    const headers=[...table.querySelectorAll('thead th')].map(th=>norm(th.textContent));
    const indexes={cop:headers.indexOf('monto cop'),ars:headers.indexOf('monto ars'),usd:headers.indexOf('monto usd')};
    if (indexes.cop<0) return;
    const rows=[...table.querySelectorAll('tbody tr')];
    const sums={cop:0,ars:0,usd:0};
    rows.forEach(row=>{
      if(indexes.cop>=0)sums.cop+=parseNumber(row.cells[indexes.cop]?.textContent);
      if(indexes.ars>=0)sums.ars+=parseNumber(row.cells[indexes.ars]?.textContent);
      if(indexes.usd>=0)sums.usd+=parseNumber(row.cells[indexes.usd]?.textContent);
    });

    let foot=table.querySelector('tfoot[data-auto-total]');
    if(!foot){foot=document.createElement('tfoot');foot.dataset.autoTotal='1';table.appendChild(foot);}
    let tr=foot.querySelector('tr');
    if(!tr){tr=document.createElement('tr');tr.className='flow-detail-total-row';foot.appendChild(tr);}
    while(tr.children.length<headers.length)tr.appendChild(document.createElement('td'));
    while(tr.children.length>headers.length)tr.lastElementChild?.remove();

    headers.forEach((_,index)=>{
      const td=tr.children[index];
      let value='';
      if(index===0)value='TOTAL';
      if(index===indexes.cop)value=formatMoney(sums.cop,'COP');
      if(index===indexes.ars)value=formatMoney(sums.ars,'ARS');
      if(index===indexes.usd)value=formatMoney(sums.usd,'USD');
      if(td&&td.textContent!==value)td.textContent=value;
    });
  }
"""
          if old_total not in text:
              raise SystemExit('addFlowDetailTotal marker not found')
          text = text.replace(old_total, new_total, 1)
          text = text.replace("        xhr.setRequestHeader('Cache-Control','no-cache');\n", "", 1)
          path.write_text(text, encoding='utf-8')

          idx=Path('index.html')
          html=idx.read_text(encoding='utf-8')
          html=html.replace('  <script src="dashboard-reliability-loop-guard.js?v=20260818-1745"></script>\n','')
          html=html.replace('dashboard-reliability-fixes.js?v=20260818-1733','dashboard-reliability-fixes.js?v=20260827-1709')
          idx.write_text(html, encoding='utf-8')

          legacy=Path('dashboard-reliability-loop-guard.js')
          if legacy.exists(): legacy.unlink()

          if 'dashboard-reliability-loop-guard.js' in idx.read_text(encoding='utf-8'):
              raise SystemExit('legacy reliability guard still loaded')
          if 'Cache-Control' in path.read_text(encoding='utf-8'):
              raise SystemExit('legacy Cache-Control header still present')
          PY

          node --check dashboard-reliability-fixes.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A dashboard-reliability-fixes.js dashboard-reliability-loop-guard.js index.html
          git commit -m "Consolidate reliability guard into owning module"
          git push

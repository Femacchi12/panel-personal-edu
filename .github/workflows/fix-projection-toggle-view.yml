name: Fix projection toggle view

on:
  push:
    paths:
      - '.github/workflows/fix-projection-toggle-view.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply fix
        run: |
          python3 scripts/fix_projection_toggle_view.py
          node --check monthly-projection-control.js
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add monthly-projection-control.js
          if git diff --cached --quiet; then
            echo "No changes required"
          else
            git commit -m "Refresh view when projection toggle changes"
            git push
          fi

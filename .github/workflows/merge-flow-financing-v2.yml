name: Merge Flow financing v2

on:
  push:
    paths:
      - .github/workflows/merge-flow-financing-v2.yml

permissions:
  contents: write

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply consolidation
        run: python .github/scripts/merge_flow_financing.py
      - name: Validate JavaScript
        run: |
          node --check flow-income-controller.js
          node --check spend-chart-controller.js
          test ! -e flow-financing-filter-fix.js
          grep -F 'spend-chart-controller.js' auth.js
          ! grep -F 'flow-financing-filter-fix.js' auth.js
      - name: Commit changes
        run: |
          git config user.name 'Eduardo Macchi'
          git config user.email 'fernandoemacchi@gmail.com'
          git add flow-income-controller.js spend-chart-controller.js auth.js flow-financing-filter-fix.js
          git commit -m 'Consolidate Flow financing ownership'
          git push

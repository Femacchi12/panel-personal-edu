name: Optimize dashboard architecture

on:
  push:
    paths:
      - .github/workflows/optimize-dashboard-architecture.yml

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply migration
        run: python .github/scripts/optimize_dashboard.py
      - name: Validate JavaScript
        run: |
          node --check app.js
          node --check investment-period-enhancement.js
          node --check monthly-projection-control.js
          node --check flow-matrix-detail-delegate.js
          test ! -e dashboard-reliability-fixes.js
          test ! -e section-structure-cleanup.js
          grep -F '.multi-filter-option[hidden]{display:none!important}' section-data-filters.css
      - name: Commit changes
        run: |
          git config user.name 'Eduardo Macchi'
          git config user.email 'fernandoemacchi@gmail.com'
          git add app.js investment-period-enhancement.js monthly-projection-control.js flow-matrix-detail-delegate.js section-data-filters.css index.html dashboard-reliability-fixes.js section-structure-cleanup.js
          git diff --cached --quiet && exit 0
          git commit -m 'Consolidate dashboard render ownership'
          git push
# rerun: 2

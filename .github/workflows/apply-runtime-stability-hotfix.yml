name: Apply runtime stability hotfix

on:
  push:
    paths:
      - '.github/workflows/apply-runtime-stability-hotfix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply runtime stability fixes
        run: |
          python3 scripts/hotfix_runtime_stability.py
          node --check monthly-projection-control.js
          node --check expense-table-advanced.js
          node --check spend-chart-controller.js
          node --check flow-matrix-v3.js
          node --check flow-income-controller.js
          node --check flow-matrix-detail-delegate.js

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add monthly-projection-control.js expense-table-advanced.js spend-chart-controller.js flow-matrix-v3.js flow-income-controller.js flow-matrix-detail-delegate.js index.html
          if git diff --cached --quiet; then
            echo "No changes required"
          else
            git commit -m "Stabilize expenses and monthly flow runtime"
            git push
          fi

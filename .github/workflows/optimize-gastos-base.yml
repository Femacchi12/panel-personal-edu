name: Optimize dashboard base rendering

on:
  push:
    paths:
      - .github/workflows/optimize-gastos-base.yml

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply second-pass optimization
        run: python .github/scripts/optimize_gastos_base.py
      - name: Validate JavaScript
        run: |
          node --check app.js
          node --check flow-financing-filter-fix.js
          node --check expense-table-advanced.js
      - name: Commit changes
        run: |
          git config user.name 'Eduardo Macchi'
          git config user.email 'fernandoemacchi@gmail.com'
          git add app.js flow-financing-filter-fix.js
          git diff --cached --quiet && exit 0
          git commit -m 'Reduce duplicate base rendering work'
          git push

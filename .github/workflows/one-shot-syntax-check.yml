name: One-shot dashboard syntax check

on:
  push:
    paths:
      - '.github/workflows/one-shot-syntax-check.yml'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check JavaScript syntax
        run: |
          set -e
          for file in movement-status-core.js data-backend-adapter.js dashboard-enhancements.js dashboard-reliability-fixes.js payment-method-filters.js movement-type-columns.js expense-table-advanced.js flow-matrix-v3.js flow-filter-kpi-stabilizer.js flow-financing-filter-fix.js monthly-projection-control.js flow-matrix-detail-delegate.js section-data-filters.js investment-period-enhancement.js; do
            node --check "$file"
          done
      - name: Verify canonical movement source
        run: |
          set -e
          if grep -R "Movimientos!A:Y" --include='*.js' .; then
            echo "Legacy A:Y consumer found"
            exit 1
          fi
          grep -q "movement-status-core.js" index.html
          grep -q "defaultValues: \['total'\]" section-data-filters.js

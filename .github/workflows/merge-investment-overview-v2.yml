name: Merge investment overview v2

on:
  push:
    paths:
      - '.github/workflows/merge-investment-overview-v2.yml'

permissions:
  contents: write

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply investment consolidation
        run: |
          set -euo pipefail
          echo '' | base64 -d > /tmp/merge_investment.py
          python /tmp/merge_investment.py
          node --check investment-period-enhancement.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Merge investment overview into official renderer"
          git push
